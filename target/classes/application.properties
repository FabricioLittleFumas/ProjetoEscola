spring.application.name=noticiarioOficial
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/apiSpringData
spring.datasource.username=postgres
spring.datasource.password=adminn

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
#spring.jpa.open-in-view=false


spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults = false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL9Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.servlet.context-path=/APIEscolaDuartina

jwt.secret=your-256-bit-secret-key-here-minimum-32-characters-long

server.port=8081

# Envio de documentos para leitura
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
